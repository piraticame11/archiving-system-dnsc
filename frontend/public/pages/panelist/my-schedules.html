<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedules — ACES Research System</title>
  <link rel="icon" type="image/webp" href="/assets/img/aw.webp">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .form-input { width:100%;padding:.5rem .75rem;font-size:.875rem;border:1px solid #d1d5db;border-radius:.5rem;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff; }
    .form-input:focus { border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.25); }
    tr:hover td { background:#f8fafc; }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="bg-primary-700 text-white px-6 py-4 flex items-center justify-between shadow sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <img src="/assets/img/aw.webp" alt="School Logo" class="w-9 h-9 object-contain rounded-lg">
      <span class="font-bold text-lg">ACES Research System</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-primary-100"></span>
      <button onclick="logout()" class="text-sm bg-primary-800 hover:bg-primary-900 px-3 py-1.5 rounded-lg transition-colors">Sign out</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-8">

    <div class="flex items-center justify-between gap-4 mb-6 flex-wrap">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">My Schedules</h1>
        <p class="text-sm text-gray-500 mt-0.5">Defense schedules you are assigned to as a panelist</p>
      </div>
      <a id="back-dashboard-btn" href="/pages/panelist/dashboard.html" class="inline-flex items-center gap-1.5 text-sm bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-3.5 py-2 rounded-lg font-medium shadow-sm transition-colors">
        &larr; Back to Dashboard
      </a>
    </div>

    <!-- Stats -->
    <div id="stats-row" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>

    <!-- Filters -->
    <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 flex flex-wrap items-center gap-3 mb-5 shadow-sm">
      <div class="relative flex-1 min-w-52">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"/></svg>
        <input id="f-search" type="text" placeholder="Search submission title…"
          class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
      </div>
      <select id="f-status" class="form-input w-auto text-sm py-2">
        <option value="">All Statuses</option>
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="rescheduled">Rescheduled</option>
      </select>
      <button onclick="resetFilters()" class="px-3 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Reset</button>
    </div>

    <!-- Schedule cards -->
    <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center text-sm text-gray-400 py-10">Loading schedules…</div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="hidden mt-6 flex items-center justify-between">
      <p id="page-info" class="text-sm text-gray-500"></p>
      <div class="flex gap-2">
        <button id="btn-prev" onclick="changePage(-1)" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Previous</button>
        <button id="btn-next" onclick="changePage(1)"  class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Next</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-gray-100 flex-shrink-0">
        <h2 id="detail-title" class="text-lg font-bold text-gray-900">Schedule Details</h2>
        <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="detail-body" class="overflow-y-auto px-6 py-5 space-y-4 flex-1"></div>
      <div id="detail-footer" class="px-6 pb-6 pt-2 border-t border-gray-100 flex-shrink-0"></div>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s||'')); return d.innerHTML; }

    async function http(fn) {
      const res = await fn(); const json = await res.json();
      if (!res.ok) throw json; return json;
    }
    const get = path => http(() => apiGet(path));

    let currentPage = 1;
    let totalPages  = 1;
    let searchTimer = null;

    const STATUS_CFG = {
      scheduled:   { label: 'Scheduled',   cls: 'bg-blue-100 text-blue-700'   },
      completed:   { label: 'Completed',   cls: 'bg-green-100 text-green-700' },
      cancelled:   { label: 'Cancelled',   cls: 'bg-red-100 text-red-700'     },
      rescheduled: { label: 'Rescheduled', cls: 'bg-yellow-100 text-yellow-700'},
    };

    function badge(status) {
      const c = STATUS_CFG[status] || { label: status, cls: 'bg-gray-100 text-gray-700' };
      return `<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold ${c.cls}">${c.label}</span>`;
    }

    /* Proposal defenses run 30 minutes; outline-to-final defenses run 1h30. */
    function fmtHM(h, m) {
      const period = h < 12 ? 'AM' : 'PM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return m === 0 ? `${h12}:00 ${period}` : `${h12}:${String(m).padStart(2,'0')} ${period}`;
    }
    function buildSlotLabels(startMin, endMin, stepMin, out) {
      for (let t = startMin; t + stepMin <= endMin; t += stepMin) {
        const sh = Math.floor(t/60), sm = t%60, eh = Math.floor((t+stepMin)/60), em = (t+stepMin)%60;
        out[`${sh}:${String(sm).padStart(2,'0')}-${eh}:${String(em).padStart(2,'0')}`] = `${fmtHM(sh,sm)} – ${fmtHM(eh,em)}`;
      }
    }
    const TIME_SLOTS = {};
    buildSlotLabels(8*60, 12*60, 30, TIME_SLOTS); buildSlotLabels(13*60, 17*60, 30, TIME_SLOTS);
    buildSlotLabels(8*60, 12*60, 60, TIME_SLOTS); buildSlotLabels(13*60, 17*60, 60, TIME_SLOTS);
    buildSlotLabels(8*60, 12*60, 90, TIME_SLOTS); buildSlotLabels(13*60, 16*60, 90, TIME_SLOTS);

    const DEFENSE_TYPE_LABEL = {
      proposal: 'Proposal',
      outline: 'Outline',
      'pre-final': 'Pre-Final',
      pre_final: 'Pre-Final',
      final: 'Final',
    };
    const PANEL_ROLE_LABEL = { chairperson: 'Chairperson', industry_panelist: 'Industry Panelist', member: 'Member' };
    function slotLabel(v) { return TIME_SLOTS[v] || v || '–'; }
    function slotsLabel(arr) {
      if (!arr || !arr.length) return '–';
      return slotLabel(arr[0]);
    }

    function fmtDate(d) {
      if (!d) return '–';
      const s = String(d).split('T')[0];
      const [y, m, day] = s.split('-');
      return new Date(+y, +m-1, +day).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
    }

    requireAuthAsync('panelist', 'instructor').then(user => {
      if (!user) return;
      document.getElementById('user-name').textContent = user.full_name || user.email;
      const dashBtn = document.getElementById('back-dashboard-btn');
      if (dashBtn && user.role === 'instructor') {
        dashBtn.href = '/pages/instructor/dashboard.html';
      }
      loadSchedules();

      document.getElementById('f-status').addEventListener('change', () => { currentPage = 1; loadSchedules(); });
      document.getElementById('f-search').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { currentPage = 1; loadSchedules(); }, 350);
      });
    }).catch(err => {
      console.error('Failed to load user:', err);
      const grid = document.getElementById('cards-grid');
      if (grid) grid.innerHTML = `<div class="col-span-full text-center text-sm text-red-500 py-10">${escHtml(err?.message || 'Authentication error')}</div>`;
    });

    let schedulesReqSeq = 0;
    async function loadSchedules() {
      const reqId = ++schedulesReqSeq;
      const params = new URLSearchParams({ page: currentPage, limit: 12 });
      const search = document.getElementById('f-search').value.trim();
      const status = document.getElementById('f-status').value;
      if (search) params.set('search', search);
      if (status) params.set('status', status);

      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '<div class="col-span-full text-center text-sm text-gray-400 py-10">Loading schedules…</div>';

      try {
        const res   = await get(`/api/v1/schedules?${params}`);
        if (reqId !== schedulesReqSeq) return;
        const items = res.data?.data || [];
        totalPages  = res.data?.pagination?.totalPages || 1;
        const total = res.data?.pagination?.total || items.length;

        renderStats(items, total);
        document.getElementById('pagination').classList.toggle('hidden', totalPages <= 1);

        if (!items.length) {
          grid.innerHTML = '<div class="col-span-full text-center text-sm text-gray-400 py-10">No assigned schedules found.</div>';
          return;
        }

        grid.innerHTML = items.map(s => {
          const dateStr  = s.scheduled_date ? String(s.scheduled_date).split('T')[0] : '';
          const upcoming = dateStr >= new Date().toISOString().slice(0,10) && s.status === 'scheduled';
          const cardTitle = s.group_names || s.submission_title || `Schedule #${s.id}`;
          const dept = s.department_codes || '';
          const year = s.group_school_years || s.school_year || '';
          const set  = s.set_names || '';
          const defType = DEFENSE_TYPE_LABEL[s.defense_type] || s.defense_type || 'Defense';

          return `
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-5 hover:shadow-md transition-shadow">
            <div class="flex items-start justify-between gap-2 mb-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap mb-2">
                  <span class="inline-flex px-2 py-0.5 rounded text-xs font-bold uppercase tracking-wide bg-primary-100 text-primary-800">${escHtml(defType)}</span>
                  ${dept ? `<span class="inline-flex px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-700">${escHtml(dept)}</span>` : ''}
                  ${set ? `<span class="inline-flex px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">${escHtml(String(set).toLowerCase().startsWith('set') ? set : 'Set ' + set)}</span>` : ''}
                  ${year ? `<span class="text-xs text-gray-500 font-medium">${escHtml(year)}</span>` : ''}
                </div>
                <h3 class="font-semibold text-gray-900 text-sm leading-snug line-clamp-2">${escHtml(cardTitle)}</h3>
                ${s.submission_title && s.submission_title !== cardTitle ? `<p class="text-xs text-primary-700 font-medium italic mt-0.5 line-clamp-1">${escHtml(s.submission_title)}</p>` : ''}
              </div>
              ${badge(s.status)}
            </div>
            <div class="space-y-1.5 text-xs text-gray-500 mb-4">
              <p class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                ${fmtDate(dateStr)}
              </p>
              <p class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                ${escHtml(slotsLabel(s.time_slots))}
              </p>
              ${s.venue_name ? `<p class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                ${escHtml(s.venue_name)}
              </p>` : ''}
            </div>
            <div class="flex gap-2">
              <button onclick="openDetail(${s.id})"
                class="flex-1 px-3 py-1.5 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                View Details
              </button>
              ${s.status !== 'cancelled' ? `
              <a href="/pages/panelist/evaluate.html?id=${s.id}"
                class="flex-1 px-3 py-1.5 text-xs font-semibold text-center text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors ${upcoming ? 'ring-2 ring-primary-400' : ''}">
                Evaluate
              </a>` : ''}
            </div>
          </div>`;
        }).join('');

        updatePagination();
      } catch (err) {
        if (reqId !== schedulesReqSeq) return;
        grid.innerHTML = `<div class="col-span-full text-center text-sm text-red-500 py-10">${escHtml(err?.message || 'Failed to load.')}</div>`;
      }
    }

    function renderStats(items, total) {
      const scheduled   = items.filter(s => s.status === 'scheduled').length;
      const completed   = items.filter(s => s.status === 'completed').length;
      const rescheduled = items.filter(s => s.status === 'rescheduled').length;
      const cards = [
        { label: 'Total',       value: total,       color: 'text-primary-700' },
        { label: 'Upcoming',    value: scheduled,   color: 'text-blue-700'    },
        { label: 'Completed',   value: completed,   color: 'text-green-700'   },
        { label: 'Rescheduled', value: rescheduled, color: 'text-yellow-700'  },
      ];
      document.getElementById('stats-row').innerHTML = cards.map(c => `
        <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 shadow-sm">
          <p class="text-xs text-gray-500 mb-0.5">${c.label}</p>
          <p class="text-2xl font-bold ${c.color}">${c.value}</p>
        </div>`).join('');
    }

    async function openDetail(id) {
      document.getElementById('detail-title').textContent = 'Loading…';
      document.getElementById('detail-body').innerHTML    = '<p class="text-sm text-gray-400 text-center py-6">Loading schedule details…</p>';
      document.getElementById('detail-footer').innerHTML  = '';
      document.getElementById('detail-modal').classList.remove('hidden');

      try {
        const res = await get(`/api/v1/schedules/${id}`);
        const s   = res.data;

        const panelHtml = s.panelists?.length
          ? s.panelists.map(p => `
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-medium bg-primary-50 text-primary-800 border border-primary-200">
              <strong class="font-semibold text-primary-900">${escHtml(PANEL_ROLE_LABEL[p.panel_role] || p.panel_role || '')}:</strong>
              <span>${escHtml(p.full_name)}</span>
            </span>`).join('')
          : '<span class="text-gray-400 text-xs">None assigned</span>';

        const groupsHtml = s.groups?.length
          ? s.groups.map(g => `
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200 space-y-1.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-gray-900 text-sm">${escHtml(g.name)}</span>
                ${g.department_code ? `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-700">${escHtml(g.department_code)}</span>` : ''}
                ${g.set_name ? `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">${escHtml(g.set_name.toLowerCase().startsWith('set') ? g.set_name : 'Set ' + g.set_name)}</span>` : ''}
                ${g.school_year ? `<span class="text-xs text-gray-400">${escHtml(g.school_year)}</span>` : ''}
              </div>
              ${g.group_title ? `<p class="text-xs text-primary-700 font-semibold italic">${escHtml(g.group_title)}</p>` : ''}
              ${g.member_names ? `<p class="text-xs text-gray-600"><strong class="font-medium text-gray-500">Members:</strong> ${escHtml(g.member_names)}</p>` : ''}
            </div>`).join('')
          : s.submission_title
            ? `<div class="bg-gray-50 rounded-xl p-4 border border-gray-200"><p class="text-sm font-medium text-gray-800">${escHtml(s.submission_title)}</p></div>`
            : '<span class="text-gray-400 text-xs">No groups assigned</span>';

        const deptStr = s.groups?.map(g => g.department_code).filter(Boolean).join(', ') || s.department_codes || '–';
        const setStr  = s.groups?.map(g => g.set_name).filter(Boolean).join(', ') || s.set_names || '–';
        const yearStr = s.school_year || s.groups?.[0]?.school_year || s.group_school_years || '–';
        const typeStr = DEFENSE_TYPE_LABEL[s.defense_type] || s.defense_type || '–';

        document.getElementById('detail-title').textContent =
          s.groups?.length ? s.groups.map(g => g.name).join(', ') : (s.submission_title || 'Schedule Details');

        document.getElementById('detail-body').innerHTML = `
          <!-- Overview Cards -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-white p-3 rounded-xl border border-gray-200">
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Type</p>
              <span class="inline-flex px-2 py-0.5 rounded text-xs font-bold uppercase bg-primary-100 text-primary-800">${escHtml(typeStr)}</span>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Department</p>
              <p class="text-sm font-semibold text-gray-800">${escHtml(deptStr)}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Year</p>
              <p class="text-sm font-semibold text-gray-800">${escHtml(yearStr)}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Set</p>
              <p class="text-sm font-semibold text-gray-800">${escHtml(setStr && setStr !== '–' ? (String(setStr).toLowerCase().startsWith('set') ? setStr : 'Set ' + setStr) : '–')}</p>
            </div>
          </div>

          <!-- Schedule Times & Venue -->
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm">
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Date</p>
              <p class="font-medium text-gray-800">${fmtDate(s.scheduled_date)}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Timeslot</p>
              <p class="font-medium text-gray-800">${escHtml(slotsLabel(s.time_slots))}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Venue</p>
              <p class="font-medium text-gray-800">${escHtml(s.venue_name || 'TBD')}</p>
            </div>
            <div class="col-span-full pt-1 border-t border-gray-200/60 flex items-center justify-between">
              <span class="text-xs text-gray-500 font-medium">Schedule Status:</span>
              ${badge(s.status)}
            </div>
          </div>

          <!-- Presenting Groups -->
          <div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Presenting Groups &amp; Members</p>
            <div class="space-y-2.5">${groupsHtml}</div>
          </div>

          <!-- Panelists -->
          <div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Assigned Panel</p>
            <div class="flex flex-wrap gap-2">${panelHtml}</div>
          </div>

          ${s.notes ? `
          <div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Notes</p>
            <p class="text-sm text-gray-700 bg-gray-50 rounded-lg p-3 border border-gray-100">${escHtml(s.notes)}</p>
          </div>` : ''}`;

        document.getElementById('detail-footer').innerHTML = s.status !== 'cancelled'
          ? `<a href="/pages/panelist/evaluate.html?id=${s.id}" class="block w-full text-center px-4 py-2.5 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-xl shadow-sm transition-colors">Go to Evaluate</a>`
          : '';
      } catch (err) {
        document.getElementById('detail-body').innerHTML = `<p class="text-sm text-red-500 text-center py-6">${escHtml(err?.message || 'Failed to load.')}</p>`;
      }
    }

    function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); }

    function changePage(dir) {
      currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
      loadSchedules();
    }

    function updatePagination() {
      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= totalPages;
      document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
    }

    function resetFilters() {
      document.getElementById('f-search').value = '';
      document.getElementById('f-status').value = '';
      currentPage = 1;
      loadSchedules();
    }
  </script>
</body>
</html>
