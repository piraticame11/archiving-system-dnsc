<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — ACES Research System</title>
  <link rel="icon" type="image/webp" href="/assets/img/aw.webp">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-primary-700 text-white px-6 py-4 flex items-center justify-between shadow">
    <div class="flex items-center gap-3">
      <img src="/assets/img/aw.webp" alt="School Logo" class="w-9 h-9 object-contain rounded-lg">
      <span class="font-bold text-lg">ACES Research System</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-primary-100"></span>
      <button onclick="logout()" class="text-sm bg-primary-800 hover:bg-primary-900 px-3 py-1.5 rounded-lg transition-colors">Sign out</button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-6 py-10">
    <div class="flex items-center gap-3 mb-8">
      <a href="/pages/instructor/dashboard.html" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Account Settings</h1>
        <p class="text-gray-500 text-sm mt-0.5">Manage your password and advisee capacity</p>
      </div>
    </div>

    <div id="temp-password-banner" class="hidden bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-sm text-yellow-800 mb-6">
      You signed in with a temporary password. Please set a new password now.
    </div>

    <!-- Change Password -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h2 class="font-semibold text-gray-800 mb-4">Change Password</h2>
      <div id="pw-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="pw-error"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <form id="password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <input id="current-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input id="new-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
            placeholder="Min 8 chars, 1 uppercase, 1 number">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
          <input id="confirm-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <button type="submit" id="pw-submit-btn"
          class="bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2.5 px-5 rounded-lg text-sm transition-colors disabled:opacity-60">
          Update Password
        </button>
      </form>
    </div>

    <!-- Advisee Capacity -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="font-semibold text-gray-800 mb-4">Advisee Group Capacity</h2>
      <div id="cap-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="cap-error"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <form id="capacity-form" class="space-y-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Maximum groups you're willing to advise at once</label>
        <input id="max-advisee-groups" type="number" min="1"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
          placeholder="Leave blank for no limit">
        <button type="submit"
          class="bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2.5 px-5 rounded-lg text-sm transition-colors">
          Save
        </button>
      </form>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    requireAuthAsync('instructor').then(async user => {
      if (!user) return;
      document.getElementById('user-name').textContent = user.full_name || user.email;

      if (sessionStorage.getItem('temp-password-notice')) {
        document.getElementById('temp-password-banner').classList.remove('hidden');
        sessionStorage.removeItem('temp-password-notice');
      }

      try {
        const res = await apiGet('/api/v1/auth/me').then(r => r.json());
        document.getElementById('max-advisee-groups').value = res.data?.max_advisee_groups ?? '';
      } catch (_) {}
    });

    document.getElementById('password-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl  = document.getElementById('pw-error');
      const succEl = document.getElementById('pw-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');

      const current_password = document.getElementById('current-password').value;
      const new_password     = document.getElementById('new-password').value;
      const confirm          = document.getElementById('confirm-password').value;

      if (new_password !== confirm) {
        errEl.textContent = 'New passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('pw-submit-btn');
      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        const res = await apiPatch('/api/v1/auth/me/password', { current_password, new_password }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = 'Password updated successfully.';
        succEl.classList.remove('hidden');
        document.getElementById('password-form').reset();
      } catch (err) {
        errEl.textContent = err.message || 'Failed to update password.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });

    document.getElementById('capacity-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl  = document.getElementById('cap-error');
      const succEl = document.getElementById('cap-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');
      const val = document.getElementById('max-advisee-groups').value.trim();
      try {
        const res = await apiPatch('/api/v1/adviser/settings', { max_advisee_groups: val || null }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = 'Saved.';
        succEl.classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message || 'Failed to save.';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
