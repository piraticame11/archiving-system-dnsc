<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Requests — ACES Research System</title>
  <link rel="icon" type="image/webp" href="/assets/img/aw.webp">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

  <nav class="bg-primary-700 text-white px-6 py-4 flex items-center justify-between shadow sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <img src="/assets/img/aw.webp" alt="School Logo" class="w-9 h-9 object-contain rounded-lg">
      <span class="font-bold text-lg">ACES Research System</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-primary-100"></span>
      <button onclick="logout()" class="text-sm bg-primary-800 hover:bg-primary-900 px-3 py-1.5 rounded-lg transition-colors">Sign out</button>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Group Requests</h1>
      <p class="text-sm text-gray-500 mt-0.5">Groups that have selected you as their adviser and are waiting for your response</p>
    </div>

    <div id="alert" class="hidden mb-4 px-4 py-3 rounded-lg text-sm font-medium"></div>

    <div id="requests-list" class="space-y-4">
      <p class="text-sm text-gray-400">Loading…</p>
    </div>
  </div>

  <!-- Reject Reason Modal -->
  <div id="reject-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <h2 class="text-lg font-bold text-gray-900 mb-4">Decline Group Request</h2>
      <label class="block text-sm font-medium text-gray-700 mb-1">Reason <span class="text-red-500">*</span></label>
      <textarea id="reject-reason" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Let the group know why…"></textarea>
      <p id="reject-error" class="text-sm text-red-600 hidden mt-1"></p>
      <div class="flex justify-end gap-3 mt-4">
        <button onclick="closeRejectModal()" class="text-sm border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-50">Cancel</button>
        <button onclick="submitReject()" class="text-sm bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">Decline Request</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    function escHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s||'')); return d.innerHTML; }

    let rejectGroupId = null;

    requireAuthAsync('instructor').then(user => {
      if (!user) return;
      document.getElementById('user-name').textContent = user.full_name || user.email;
      loadRequests();
    });

    async function loadRequests() {
      const list = document.getElementById('requests-list');
      list.innerHTML = '<p class="text-sm text-gray-400">Loading…</p>';
      try {
        const res  = await apiGet('/api/v1/adviser/group-requests').then(r => r.json());
        const reqs = res.data || [];
        if (!reqs.length) {
          list.innerHTML = '<p class="text-sm text-gray-400">No pending group requests.</p>';
          return;
        }
        list.innerHTML = reqs.map(g => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div>
                <p class="font-semibold text-gray-900">${escHtml(g.name)}</p>
                <p class="text-xs text-gray-400 mt-0.5">Leader: ${escHtml(g.leader_name)} · ${escHtml(g.department_name || '—')} · SY ${escHtml(g.school_year)} · ${g.member_count} member(s)</p>
                ${(g.titles || []).length ? `<div class="mt-2 space-y-0.5">${g.titles.map((t, i) => `<p class="text-sm text-gray-700 italic">${i + 1}. "${escHtml(t.title)}"</p>`).join('')}</div>` : '<p class="text-sm text-gray-400 italic mt-2">No titles submitted yet.</p>'}
              </div>
              <div class="flex gap-2 flex-shrink-0">
                <button onclick="approveRequest(${g.id})" class="text-sm bg-green-600 text-white px-3 py-1.5 rounded-lg hover:bg-green-700 transition-colors">Approve</button>
                <button onclick="openRejectModal(${g.id})" class="text-sm bg-red-50 border border-red-200 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors">Decline</button>
              </div>
            </div>
          </div>`).join('');
      } catch (err) {
        list.innerHTML = `<p class="text-sm text-red-500">Failed to load requests.</p>`;
      }
    }

    async function approveRequest(groupId) {
      try {
        const res = await apiPost(`/api/v1/adviser/group-requests/${groupId}/approve`, {}).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        showAlert('Group request approved.', 'success');
        loadRequests();
      } catch (err) {
        showAlert(err.message || 'Failed to approve request.', 'error');
      }
    }

    function openRejectModal(groupId) {
      rejectGroupId = groupId;
      document.getElementById('reject-reason').value = '';
      document.getElementById('reject-error').classList.add('hidden');
      document.getElementById('reject-modal').classList.remove('hidden');
    }
    function closeRejectModal() { document.getElementById('reject-modal').classList.add('hidden'); rejectGroupId = null; }

    async function submitReject() {
      const reason = document.getElementById('reject-reason').value.trim();
      if (!reason) {
        document.getElementById('reject-error').textContent = 'A reason is required.';
        document.getElementById('reject-error').classList.remove('hidden');
        return;
      }
      try {
        const res = await apiPost(`/api/v1/adviser/group-requests/${rejectGroupId}/reject`, { reason }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        closeRejectModal();
        showAlert('Group request declined.', 'success');
        loadRequests();
      } catch (err) {
        document.getElementById('reject-error').textContent = err.message || 'Failed to decline request.';
        document.getElementById('reject-error').classList.remove('hidden');
      }
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = type === 'success'
        ? 'mb-4 px-4 py-3 rounded-lg text-sm font-medium bg-green-50 text-green-700 border border-green-200'
        : 'mb-4 px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 border border-red-200';
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>
