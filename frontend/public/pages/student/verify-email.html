<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Personal Email — ACES Research System</title>
  <link rel="icon" type="image/webp" href="/assets/img/aw.webp">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
  <div class="w-full max-w-md px-4">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Verify Your Personal Email</h1>
        <p class="text-sm text-gray-500 mt-1">One-time step: bind a personal email so you can recover your account and receive important updates.</p>
      </div>

      <div id="success-msg" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="error-msg"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>

      <!-- Step 1: enter personal email -->
      <form id="email-form" novalidate>
        <label class="block text-sm font-medium text-gray-700 mb-1">Personal Email Address</label>
        <input id="personal-email" type="email" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
          placeholder="you@gmail.com">
        <button type="submit" id="send-btn"
          class="mt-5 w-full bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition-colors disabled:opacity-60">
          Send Verification Code
        </button>
      </form>

      <!-- Step 2: enter OTP -->
      <form id="otp-form" class="hidden" novalidate>
        <label class="block text-sm font-medium text-gray-700 mb-1">6-Digit Code</label>
        <input id="otp-code" type="text" inputmode="numeric" maxlength="6" pattern="\d{6}" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono tracking-widest text-center text-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
          placeholder="000000">
        <button type="submit" id="verify-btn"
          class="mt-5 w-full bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition-colors disabled:opacity-60">
          Verify
        </button>
        <button type="button" id="resend-btn" onclick="resendCode()"
          class="mt-3 w-full text-sm text-primary-600 hover:underline">
          Resend code
        </button>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    requireAuthAsync('student').then(user => { if (!user) return; });

    const errEl  = document.getElementById('error-msg');
    const succEl = document.getElementById('success-msg');
    function showError(msg)   { errEl.textContent = msg; errEl.classList.remove('hidden'); succEl.classList.add('hidden'); }
    function showSuccess(msg) { succEl.textContent = msg; succEl.classList.remove('hidden'); errEl.classList.add('hidden'); }

    document.getElementById('email-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res  = await apiPost('/api/v1/auth/me/personal-email', { personal_email: document.getElementById('personal-email').value.trim() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showSuccess(data.message || 'Code sent.');
        document.getElementById('email-form').classList.add('hidden');
        document.getElementById('otp-form').classList.remove('hidden');
      } catch (err) {
        showError(err.message || 'Failed to send code.');
      } finally {
        btn.disabled = false; btn.textContent = 'Send Verification Code';
      }
    });

    document.getElementById('otp-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('verify-btn');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const res  = await apiPost('/api/v1/auth/me/personal-email/verify', { code: document.getElementById('otp-code').value.trim() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showSuccess('Verified! Redirecting…');
        setTimeout(() => { window.location.href = '/pages/student/dashboard.html'; }, 1000);
      } catch (err) {
        showError(err.message || 'Verification failed.');
      } finally {
        btn.disabled = false; btn.textContent = 'Verify';
      }
    });

    async function resendCode() {
      const btn = document.getElementById('resend-btn');
      btn.disabled = true;
      try {
        const res  = await apiPost('/api/v1/auth/me/personal-email/resend', {});
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showSuccess(data.message || 'A new code has been sent.');
      } catch (err) {
        showError(err.message || 'Failed to resend code.');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
