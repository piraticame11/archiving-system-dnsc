<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — ACES Research System</title>
  <link rel="icon" type="image/webp" href="/assets/img/aw.webp">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-primary-700 text-white px-6 py-4 flex items-center justify-between shadow">
    <div class="flex items-center gap-3">
      <img src="/assets/img/aw.webp" alt="School Logo" class="w-9 h-9 object-contain rounded-lg">
      <span class="font-bold text-lg">ACES Research System</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-primary-100"></span>
      <button onclick="logout()" class="text-sm bg-primary-800 hover:bg-primary-900 px-3 py-1.5 rounded-lg transition-colors">Sign out</button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-6 py-10">
    <div class="flex items-center gap-3 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Account Settings</h1>
        <p class="text-gray-500 text-sm mt-0.5">Manage your password and personal email</p>
      </div>
    </div>

    <div id="temp-password-banner" class="hidden bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-sm text-yellow-800 mb-6">
      You signed in with a temporary password. Please set a new password now.
    </div>

    <!-- Change Password -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h2 class="font-semibold text-gray-800 mb-4">Change Password</h2>
      <div id="pw-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="pw-error"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <form id="password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <input id="current-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input id="new-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
            placeholder="Min 8 chars, 1 uppercase, 1 number">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
          <input id="confirm-password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <button type="submit" id="pw-submit-btn"
          class="bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2.5 px-5 rounded-lg text-sm transition-colors disabled:opacity-60">
          Update Password
        </button>
      </form>
    </div>

    <!-- Personal Email -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="font-semibold text-gray-800 mb-4">Personal Email</h2>
      <div id="email-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="email-error"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>

      <div id="email-status" class="flex items-center justify-between mb-4">
        <div>
          <p id="email-status-value" class="text-sm text-gray-800 font-medium"></p>
          <p id="email-status-badge" class="text-xs mt-0.5"></p>
        </div>
        <button onclick="showChangeEmailForm()" class="text-sm border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-colors">Change</button>
      </div>

      <form id="change-email-form" class="hidden space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Personal Email</label>
          <input id="new-personal-email" type="email" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <button type="submit" class="bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors">Send Verification Code</button>
      </form>

      <div id="verify-email-section" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Enter the 6-digit code sent to your email</label>
        <input id="settings-otp-code" type="text" inputmode="numeric" maxlength="6"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-primary-500">
        <div class="flex gap-3">
          <button onclick="submitSettingsOtp()" class="bg-primary-700 hover:bg-primary-800 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors">Verify</button>
          <button onclick="resendSettingsOtp()" class="text-sm text-primary-600 hover:underline">Resend code</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    requireAuthAsync('student').then(async user => {
      if (!user) return;
      document.getElementById('user-name').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Student';

      if (sessionStorage.getItem('temp-password-notice')) {
        document.getElementById('temp-password-banner').classList.remove('hidden');
        sessionStorage.removeItem('temp-password-notice');
      }

      await loadEmailStatus();
    });

    async function loadEmailStatus() {
      try {
        const res  = await apiGet('/api/v1/auth/me').then(r => r.json());
        const me   = res.data;
        const val  = document.getElementById('email-status-value');
        const badge = document.getElementById('email-status-badge');
        if (!me.personal_email) {
          val.textContent = 'No personal email set.';
          badge.innerHTML = '';
        } else {
          val.textContent = me.personal_email;
          badge.innerHTML = me.personal_email_verified_at
            ? '<span class="text-green-600 font-medium">Verified</span>'
            : '<span class="text-yellow-600 font-medium">Not verified — <a href="/pages/student/verify-email.html" class="underline">finish verifying</a></span>';
        }
      } catch (_) {}
    }

    /* ── Change Password ────────────────────────────────────────────── */
    document.getElementById('password-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl  = document.getElementById('pw-error');
      const succEl = document.getElementById('pw-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');

      const current_password = document.getElementById('current-password').value;
      const new_password     = document.getElementById('new-password').value;
      const confirm          = document.getElementById('confirm-password').value;

      if (new_password !== confirm) {
        errEl.textContent = 'New passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('pw-submit-btn');
      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        const res  = await apiPatch('/api/v1/auth/me/password', { current_password, new_password }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = 'Password updated successfully.';
        succEl.classList.remove('hidden');
        document.getElementById('password-form').reset();
      } catch (err) {
        errEl.textContent = err.message || 'Failed to update password.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });

    /* ── Personal Email ─────────────────────────────────────────────── */
    function showChangeEmailForm() {
      document.getElementById('change-email-form').classList.remove('hidden');
      document.getElementById('verify-email-section').classList.add('hidden');
    }

    document.getElementById('change-email-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl  = document.getElementById('email-error');
      const succEl = document.getElementById('email-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');
      try {
        const res = await apiPost('/api/v1/auth/me/personal-email', { personal_email: document.getElementById('new-personal-email').value.trim() }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = res.message || 'Code sent.';
        succEl.classList.remove('hidden');
        document.getElementById('change-email-form').classList.add('hidden');
        document.getElementById('verify-email-section').classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message || 'Failed to send code.';
        errEl.classList.remove('hidden');
      }
    });

    async function submitSettingsOtp() {
      const errEl  = document.getElementById('email-error');
      const succEl = document.getElementById('email-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');
      try {
        const res = await apiPost('/api/v1/auth/me/personal-email/verify', { code: document.getElementById('settings-otp-code').value.trim() }).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = 'Personal email verified.';
        succEl.classList.remove('hidden');
        document.getElementById('verify-email-section').classList.add('hidden');
        await loadEmailStatus();
      } catch (err) {
        errEl.textContent = err.message || 'Verification failed.';
        errEl.classList.remove('hidden');
      }
    }

    async function resendSettingsOtp() {
      const errEl  = document.getElementById('email-error');
      const succEl = document.getElementById('email-success');
      errEl.classList.add('hidden'); succEl.classList.add('hidden');
      try {
        const res = await apiPost('/api/v1/auth/me/personal-email/resend', {}).then(r => r.json());
        if (!res.success) throw new Error(res.message);
        succEl.textContent = res.message || 'A new code has been sent.';
        succEl.classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message || 'Failed to resend code.';
        errEl.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
